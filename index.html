<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YtLove Pro - Sub4Sub & Views</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Bar */
        .top-bar {
            background-color: #1f1f1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #2c2c2c;
        }
        .menu-icon, .coin-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            cursor: pointer;
        }
        .app-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            letter-spacing: 0.5px;
        }
        .coin-badge {
            background-color: #2c2c2c;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #ffcc00;
            border: 1px solid #444;
        }
        .coin-badge svg {
            width: 16px;
            height: 16px;
            fill: #ffcc00;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        /* Tabs Panels */
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }

        /* Watch / Sub / Like Cards */
        .task-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid #2c2c2c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .video-thumb-container {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #000;
        }
        .video-thumb-container iframe, .video-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        .task-info {
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-details h4 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #f1f1f1;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .reward-info {
            font-size: 13px;
            color: #aaa;
            display: flex;
            gap: 12px;
        }
        .reward-info span {
            color: #ffcc00;
            font-weight: bold;
        }
        .btn-action {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-action:active {
            background-color: #cc0000;
        }
        .btn-action:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        /* Timer Overlay */
        .timer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .timer-text {
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 8px;
        }
        .timer-sub {
            font-size: 13px;
            color: #aaa;
        }

        /* Campaigns Form & List */
        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .campaign-header h2 {
            font-size: 18px;
            color: #fff;
        }
        .btn-add {
            background-color: #ff0000;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255,0,0,0.4);
        }
        .campaign-card {
            background-color: #1e1e1e;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #2c2c2c;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .campaign-thumb {
            width: 80px;
            height: 50px;
            background-color: #333;
            border-radius: 6px;
            object-fit: cover;
        }
        .campaign-details {
            flex: 1;
        }
        .campaign-details h5 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #ddd;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #333;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #ff0000;
            width: 0%;
        }
        .campaign-stats {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background-color: #1f1f1f;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .modal-content h3 {
            margin-bottom: 14px;
            font-size: 16px;
            color: #fff;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-cancel { background-color: #333; color: #fff; }
        .btn-submit { background-color: #ff0000; color: #fff; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #1a1a1a;
            border-top: 1px solid #2c2c2c;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            cursor: pointer;
            font-size: 11px;
            gap: 3px;
            flex: 1;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: #888;
        }
        .nav-item.active {
            color: #ff0000;
        }
        .nav-item.active svg {
            fill: #ff0000;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="menu-icon" onclick="alert('YtLove Pro v3.2 - Müstakil Sub4Sub Sistemi')">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span class="app-title">YtLove</span>
        </div>
        <div class="coin-badge">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
            <span id="userCoins">650</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="content">
        
        <!-- 1. İzle (Views) Paneli -->
        <div id="panel-views" class="panel active">
            <div id="watchList">
                <!-- Dinamik Video Kartları Buraya Gelecek -->
            </div>
        </div>

        <!-- 2. Abone Ol (Subs) Paneli -->
        <div id="panel-subs" class="panel">
            <div id="subList">
                <!-- Dinamik Abone Ol Kartları -->
            </div>
        </div>

        <!-- 3. Beğen (Likes) Paneli -->
        <div id="panel-likes" class="panel">
            <div id="likeList">
                <!-- Dinamik Beğen Kartları -->
            </div>
        </div>

        <!-- 4. Kampanyalar (Campaigns) Paneli -->
        <div id="panel-campaigns" class="panel">
            <div class="campaign-header">
                <h2>Kampanyalarım</h2>
                <button class="btn-add" onclick="openModal()">+</button>
            </div>
            <div id="campaignList">
                <!-- Kullanıcının Oluşturduğu Kampanyalar -->
            </div>
        </div>

    </div>

    <!-- Yeni Kampanya Ekleme Modal -->
    <div class="modal" id="campaignModal">
        <div class="modal-content">
            <h3>Kampanya Oluştur</h3>
            <div class="form-group">
                <label>YouTube Video Linki</label>
                <input type="text" id="videoUrlInput" placeholder="https://youtu.be/...">
            </div>
            <div class="form-group">
                <label>Kampanya Türü</label>
                <select id="campTypeInput">
                    <option value="view">İzlenme (Views)</option>
                    <option value="sub">Abone (Subscribers)</option>
                    <option value="like">Beğeni (Likes)</option>
                </select>
            </div>
            <div class="form-group">
                <label>İstenen Miktar (Adet)</label>
                <input type="number" id="campCountInput" value="10" min="5">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-submit" onclick="createCampaign()">Oluştur (100 Coin)</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('views', this)">
            <svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <span>İzle</span>
        </div>
        <div class="nav-item" onclick="switchTab('subs', this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Abone Ol</span>
        </div>
        <div class="nav-item" onclick="switchTab('likes', this)">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            <span>Beğen</span>
        </div>
        <div class="nav-item" onclick="switchTab('campaigns', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <span>Kampanyalar</span>
        </div>
    </div>

    <script>
        let coins = 650;
        
        // Örnek Görev Listeleri
        const sampleTasks = {
            views: [
                { id: '1', title: 'Melankolik Beat & Enstrümantal', duration: 60, reward: 60, videoId: 'dQw4w9WgXcQ' },
                { id: '2', title: 'Dönerci Günlükleri - Çalışma Anıları', duration: 45, reward: 45, videoId: '3JZ_D3ELwOQ' },
                { id: '3', title: 'FL Studio Akustik Vokal Miks', duration: 60, reward: 60, videoId: 'tgbNymZ7vqY' }
            ],
            subs: [
                { id: 's1', title: 'Mehmet Özel - Kanal Abone Ol', duration: 30, reward: 90, videoId: 'kJQP7kiw5Fk' },
                { id: 's2', title: 'Anadolu Müzik Dağıtım', duration: 30, reward: 90, videoId: '9bZkp7q19f0' }
            ],
            likes: [
                { id: 'l1', title: 'Geri Dönüyorum (Official Video)', duration: 20, reward: 30, videoId: 'JGwWNGJdvx8' }
            ]
        };

        let userCampaigns = [
            { title: 'Geri Dönüyorum Klip Tanıtımı', type: 'İzlenme', current: 14, target: 50, thumb: 'https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg' }
        ];

        function updateCoins(amount) {
            coins += amount;
            document.getElementById('userCoins').innerText = coins;
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('panel-' + tabName).classList.add('active');
            element.classList.add('active');

            if(tabName === 'campaigns') renderCampaigns();
        }

        function renderTasks() {
            // İzle Sekmesi
            let viewHtml = '';
            sampleTasks.views.forEach((item, index) => {
                viewHtml += `
                <div class="task-card" id="task-view-${index}">
                    <div class="video-thumb-container" id="thumb-container-${index}">
                        <img src="https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg" style="width:100%; height:100%;">
                    </div>
                    <div class="task-info">
                        <div class="task-details">
                            <h4>${item.title}</h4>
                            <div class="reward-info">Süre: ${item.duration}s <span>+${item.reward} Coin</span></div>
                        </div>
                        <button class="btn-action" onclick="startTask('views', ${index}, ${item.duration}, ${item.reward})">İzle ve Kazan</button>
                    </div>
                </div>`;
            });
            document.getElementById('watchList').innerHTML = viewHtml;

            // Abone Ol Sekmesi
            let subHtml = '';
            sampleTasks.subs.forEach((item, index) => {
                subHtml += `
                <div class="task-card" id="task-sub-${index}">
                    <div class="video-thumb-container">
                        <img src="https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg" style="width:100%; height:100%;">
                    </div>
                    <div class="task-info">
                        <div class="task-details">
                            <h4>${item.title}</h4>
                            <div class="reward-info">Abone Ol <span>+${item.reward} Coin</span></div>
                        </div>
                        <button class="btn-action" onclick="startTask('subs', ${index}, ${item.duration}, ${item.reward})">Abone Ol</button>
                    </div>
                </div>`;
            });
            document.getElementById('subList').innerHTML = subHtml;

            // Beğen Sekmesi
            let likeHtml = '';
            sampleTasks.likes.forEach((item, index) => {
                likeHtml += `
                <div class="task-card" id="task-like-${index}">
                    <div class="video-thumb-container">
                        <img src="https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg" style="width:100%; height:100%;">
                    </div>
                    <div class="task-info">
                        <div class="task-details">
                            <h4>${item.title}</h4>
                            <div class="reward-info">Videoyu Beğen <span>+${item.reward} Coin</span></div>
                        </div>
                        <button class="btn-action" onclick="startTask('likes', ${index}, ${item.duration}, ${item.reward})">Beğen</button>
                    </div>
                </div>`;
            });
            document.getElementById('likeList').innerHTML = likeHtml;
        }

        // Sayaç ve Görev Tamamlama Mekanizması
        function startTask(category, index, duration, reward) {
            const cardContainer = document.getElementById(`task-${category}-${index}`);
            const thumbContainer = cardContainer.querySelector('.video-thumb-container');
            
            // Üzerine Sayaç Katmanı (Overlay) Ekle
            const overlay = document.createElement('div');
            overlay.className = 'timer-overlay';
            overlay.innerHTML = `
                <div class="timer-text" id="countdown-${category}-${index}">${duration}</div>
                <div class="timer-sub">Lütfen sürenin bitmesini bekleyin...</div>
            `;
            thumbContainer.appendChild(overlay);

            let timeLeft = duration;
            let timerInterval = setInterval(() => {
                timeLeft--;
                let counterEl = document.getElementById(`countdown-${category}-${index}`);
                if(counterEl) counterEl.innerText = timeLeft;

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    overlay.remove();
                    updateCoins(reward);
                    alert(`Tebrikler! ${reward} coin kazandınız.`);
                    cardContainer.style.opacity = '0.5';
                    cardContainer.style.pointerEvents = 'none';
                }
            }, 1000);
        }

        // Kampanya Modal İşlemleri
        function openModal() {
            document.getElementById('campaignModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('campaignModal').style.display = 'none';
        }

        function createCampaign() {
            let url = document.getElementById('videoUrlInput').value;
            let type = document.getElementById('campTypeInput').value;
            let count = parseInt(document.getElementById('campCountInput').value);

            if(!url) {
                alert('Lütfen geçerli bir YouTube video linki girin.');
                return;
            }

            if(coins < 100) {
                alert('Yeterli coin bakiyeniz yok!');
                return;
            }

            updateCoins(-100);
            userCampaigns.unshift({
                title: 'Yeni YouTube Kampanyası',
                type: type === 'view' ? 'İzlenme' : (type === 'sub' ? 'Abone' : 'Beğeni'),
                current: 0,
                target: count,
                thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg'
            });

            closeModal();
            renderCampaigns();
            alert('Kampanyanız başarıyla başlatıldı!');
        }

        function renderCampaigns() {
            let html = '';
            userCampaigns.forEach(c => {
                let percent = (c.current / c.target) * 100;
                html += `
                <div class="campaign-card">
                    <img src="${c.thumb}" class="campaign-thumb">
                    <div class="campaign-details">
                        <h5>${c.title} (${c.type})</h5>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${percent}%;"></div>
                        </div>
                        <div class="campaign-stats">
                            <span>Tamamlanan: ${c.current} / ${c.target}</span>
                            <span style="color:#ffcc00; font-weight:bold;">Aktif</span>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('campaignList').innerHTML = html;
        }
