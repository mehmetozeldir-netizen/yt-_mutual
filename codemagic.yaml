workflows:
  default-workflow:
    name: YT Mutual Workflow
    environment:
      flutter: stable
    scripts:
      - name: Clean old android folder
        script: rm -rf android
      - name: Generate Android Platform Files
        script: flutter create . --platforms=android
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
